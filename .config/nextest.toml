# Profiles for cargo-nextest. `cargo xtask ci test` uses `ci`.

[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci]
fail-fast = false
failure-output = "immediate-final"
status-level = "skip"
final-status-level = "slow"
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci.junit]
path = "junit.xml"

# Container tests: slower to start, and fewer at once so the machine stays usable.
[profile.integration]
fail-fast = false
failure-output = "immediate-final"
test-threads = 2
slow-timeout = { period = "120s", terminate-after = 5 }

[profile.integration.junit]
path = "junit.xml"
