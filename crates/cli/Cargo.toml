[package]
name = "treasury-cli"
description = "The treasury command-line tool: query and export, classify statements, parse connection strings, import"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[[bin]]
name = "treasury"
path = "src/main.rs"

[dependencies]
treasury-core = { workspace = true, features = ["runtime"] }
treasury-sql.workspace = true
treasury-import.workspace = true
treasury-export.workspace = true
treasury-driver-postgres.workspace = true
treasury-driver-mysql.workspace = true
treasury-driver-mssql.workspace = true
anyhow.workspace = true
futures.workspace = true
secrecy.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
serde_json.workspace = true
clap = { version = "4.6.10", features = ["derive"] }

[dev-dependencies]
treasury-tests.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
testcontainers = { version = "0.28.0", default-features = false }

[lints]
workspace = true
