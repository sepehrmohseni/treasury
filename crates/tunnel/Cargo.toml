[package]
name = "treasury-tunnel"
description = "SSH tunnels and TLS client configuration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
treasury-core.workspace = true
async-trait.workspace = true
secrecy.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "sync", "time", "rt", "macros"] }
russh = { version = "0.65.4", default-features = false, features = ["ring", "rsa", "flate2"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7.1"
pkcs8 = { version = "0.11.0", features = ["encryption", "pem", "std"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }

[dev-dependencies]
rand = "0.10.4"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring", "pem"] }
tokio = { workspace = true, features = ["net", "io-util", "sync", "time", "rt", "rt-multi-thread", "macros"] }
tempfile.workspace = true

[lints]
workspace = true
