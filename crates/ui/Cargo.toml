[package]
name = "treasury-ui"
description = "The Treasury interface: Leptos compiled to WebAssembly, shown in the app's window"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
# The data types only: cursors, caches and tasks stay in the app.
treasury-core = { path = "../core", default-features = false }
treasury-sql.workspace = true
treasury-ipc.workspace = true
leptos = { version = "0.8.23", features = ["csr"] }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4.80"
js-sys = "0.3.107"
web-sys = { version = "0.3.107", features = ["HtmlTextAreaElement", "HtmlElement", "KeyboardEvent", "Element", "DomRect", "Window", "Document", "Navigator", "Clipboard"] }
serde.workspace = true
secrecy.workspace = true
serde_json.workspace = true
serde-wasm-bindgen = "0.6.5"
console_error_panic_hook = "0.1.7"

[lints]
workspace = true
