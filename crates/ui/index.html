<script>
  // Errors while the interface starts, kept in the window for diagnosing a blank start (the
  // desktop test reads them). Nothing is sent anywhere.
  window.__startupErrors = [];
  addEventListener("error", (e) => window.__startupErrors.push(String(e.message || e)));
  addEventListener("unhandledrejection", (e) => window.__startupErrors.push(String(e.reason)));
</script>
