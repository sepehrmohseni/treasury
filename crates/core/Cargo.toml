[package]
name = "treasury-core"
description = "Value model, driver capability traits, errors, result cursors and page cache"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[features]
default = ["runtime"]
# Result cursors, the page cache and task helpers: everything that needs tokio, files or
# encryption. The interface, compiled to WebAssembly, uses the data types without it.
runtime = ["dep:tokio", "dep:tempfile", "dep:chacha20poly1305", "dep:rmp-serde", "dep:tracing"]

[dependencies]
async-trait.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"], optional = true }
serde.workspace = true
serde_json.workspace = true
secrecy.workspace = true
zeroize.workspace = true
chacha20poly1305 = { workspace = true, optional = true }
rmp-serde = { workspace = true, optional = true }
getrandom.workspace = true
tempfile = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "rt-multi-thread", "macros", "test-util"] }

[lints]
workspace = true
