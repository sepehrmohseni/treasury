# cargo-deny: licenses, advisories, bans and sources. Run with `cargo xtask ci deny`.

[graph]
# Every platform Treasury ships to, so a dependency that only appears on one of them is checked.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-linux-android",
  "armv7-linux-androideabi",
  "x86_64-linux-android",
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
]
all-features = true

[output]
feature-depth = 1

[advisories]
ignore = []

[licenses]
# Permissive licenses compatible with distributing Treasury under MIT OR Apache-2.0.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
]
confidence-threshold = 0.9
exceptions = []

[licenses.private]
# Workspace crates are never published; their license is the workspace's.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
  # No OpenSSL anywhere: TLS is rustls.
  { name = "openssl", reason = "TLS is rustls only" },
  { name = "openssl-sys", reason = "TLS is rustls only" },
  { name = "native-tls", reason = "TLS is rustls only" },
  # One crypto provider across the workspace: ring.
  { name = "aws-lc-rs", reason = "ring is the only rustls crypto provider" },
  { name = "aws-lc-sys", reason = "ring is the only rustls crypto provider" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
