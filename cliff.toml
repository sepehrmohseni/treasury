# git-cliff: CHANGELOG.md and release notes from Conventional Commits.
# feat -> Added, fix -> Fixed, perf and refactor -> Changed. Housekeeping (chore, ci, build, test,
# style, docs) stays out of the changelog.

[changelog]
header = """
# Changelog

Notable changes to Treasury, grouped as Added, Changed and Fixed. Versions follow Semantic
Versioning.
"""
body = """
{% if version %}\
    ## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
    ## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim }}
    {% for commit in commits %}
        - {% if commit.scope %}{{ commit.scope }}: {% endif %}\
            {% if commit.breaking %}(breaking) {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}
"""
trim = true
render_always = true

[git]
conventional_commits = true
filter_unconventional = true
require_conventional = false
split_commits = false
protect_breaking_commits = true
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 2 -->Fixed" },
  { message = "^(perf|refactor)", group = "<!-- 1 -->Changed" },
  { message = ".*", skip = true },
]
filter_commits = true
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
topo_order_commits = true
sort_commits = "oldest"
