[workspace]
resolver = "3"
members = ["crates/*", "tests", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sepehrmohseni/treasury"
homepage = "https://sepehrmohseni.github.io/treasury/"
publish = false

[workspace.dependencies]
treasury-core = { path = "crates/core" }
treasury-sql = { path = "crates/sql" }
treasury-vault = { path = "crates/vault" }
treasury-store = { path = "crates/store" }
treasury-tunnel = { path = "crates/tunnel" }
treasury-export = { path = "crates/export" }
treasury-import = { path = "crates/import" }
treasury-driver-postgres = { path = "crates/driver-postgres" }
treasury-driver-mysql = { path = "crates/driver-mysql" }
treasury-driver-mssql = { path = "crates/driver-mssql" }

async-trait = "0.1.92"
futures = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
tokio = { version = "1.54.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
rmp-serde = "1.3.1"
thiserror = "2.0.21"
anyhow = "1.0.105"
secrecy = "0.10.3"
zeroize = { version = "1.9.2", features = ["derive", "std"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
getrandom = { version = "0.4.3", features = ["std"] }
tempfile = "3.27.0"
tracing = "0.1.44"
proptest = "1.12.0"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"

# Driver tasks must unwind so that a panic becomes an error for one request instead of ending the
# process.
[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
panic = "unwind"

[profile.dev]
debug = "line-tables-only"

# Key derivation and ciphers are unusably slow without optimization, even in tests.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.chacha20]
opt-level = 3

[profile.dev.package.poly1305]
opt-level = 3
