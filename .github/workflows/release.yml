name: Release

# Runs on a version tag made by `cargo xtask release <version>`. It checks the tag against the
# manifests, runs every CI check, builds and signs the desktop packages on each platform, and
# publishes one release with all of them, their checksums, an SBOM and the updater feed. A last
# job downloads the published release and checks it.
#
# A push to main that changes how releases are built runs the package builds alone, as a dry
# run: nothing is signed or published, and the packages stay with the run for a week.

on:
  push:
    tags: ["v*.*.*"]
    branches: [main]
    # Only for branch pushes; GitHub does not apply path filters to tags.
    paths:
      - .github/workflows/release.yml
      - crates/app/tauri.conf.json
      - crates/app/Cargo.toml

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  version:
    name: tag matches the manifests
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.100.0"
      - run: cargo xtask check-version "$GITHUB_REF_NAME"

  checks:
    name: every CI check
    needs: version
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/ci.yml

  build:
    name: packages (${{ matrix.name }})
    needs: [version, checks]
    # On a tag both must pass; on a dry run both are skipped.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu, so the packages run on older glibc too.
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
          - name: linux-arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: appimage,deb,rpm
          - name: macos
            os: macos-latest
            target: universal-apple-darwin
            bundles: app,dmg
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.100.0"
          targets: >-
            wasm32-unknown-unknown,${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}
      - name: Install the desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev patchelf file
      - name: Install wasm-opt (binaryen, pinned)
        shell: bash
        run: |
          dir="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")/binaryen"
          bash docker/ci/install-binaryen.sh "$dir"
          if command -v cygpath >/dev/null 2>&1; then
            cygpath -w "$dir/bin" >> "$GITHUB_PATH"
          else
            echo "$dir/bin" >> "$GITHUB_PATH"
          fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.name }}
      # The same pinned versions as docker/ci/Dockerfile; --locked makes cargo check every
      # source against the tools' own lockfiles.
      - name: Install the interface and app tools
        shell: bash
        run: |
          cargo install --locked trunk@0.22.2
          cargo install --locked wasm-bindgen-cli@0.2.130
          cargo install --locked tauri-cli@2.12.6
      - name: Build and sign
        shell: bash
        env:
          # Only a tagged build gets the key; a dry run builds unsigned.
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.ref_type == 'tag' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.ref_type == 'tag' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          cd crates/app
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            cargo tauri build --ci --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}" \
              --config '{"bundle":{"createUpdaterArtifacts":false}}'
            exit 0
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is not set; update packages cannot be signed."
            exit 1
          fi
          cargo tauri build --ci --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}"
      - name: Collect the packages
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          bundle="target/${{ matrix.target }}/release/bundle"
          mkdir -p out
          find "$bundle" -maxdepth 2 -type f \( -name '*.AppImage' -o -name '*.AppImage.sig' \
            -o -name '*.deb' -o -name '*.deb.sig' -o -name '*.rpm' -o -name '*.rpm.sig' \
            -o -name '*.dmg' -o -name '*.msi' -o -name '*.msi.sig' -o -name '*-setup.exe' \
            -o -name '*-setup.exe.sig' \) -exec cp {} out/ \;
          # The macOS update package carries no version in its name; give it one.
          if [ -f "$bundle/macos/Treasury.app.tar.gz" ]; then
            cp "$bundle/macos/Treasury.app.tar.gz" "out/Treasury_${version}_universal.app.tar.gz"
            cp "$bundle/macos/Treasury.app.tar.gz.sig" "out/Treasury_${version}_universal.app.tar.gz.sig"
          fi
          ls -l out
          test -n "$(ls out)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.name }}
          path: out/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.100.0"
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: git-cliff@2.14.2,cargo-cyclonedx@0.5.10
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          path: assets
          merge-multiple: true
      - name: Release notes
        run: git-cliff --latest --strip header > notes.md && cat notes.md
      - name: Update feed, SBOM and checksums
        env:
          TREASURY_RELEASE_NOTES: notes.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          cargo xtask latest-json "$version" assets "$base"
          cargo cyclonedx --format json --spec-version 1.5 --override-filename treasury-sbom
          cp crates/app/treasury-sbom.json "assets/treasury-${version}-sbom.cdx.json"
          (cd assets && sha256sum -- * > SHA256SUMS)
          cat assets/SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "Treasury ${GITHUB_REF_NAME#v}" --notes-file notes.md

  verify:
    name: check the published release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - name: Download every asset and check the checksums and the update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir release
          cd release
          sha256sum -c SHA256SUMS
          test "$(jq -r .version latest.json)" = "${GITHUB_REF_NAME#v}"
          for url in $(jq -r '.platforms[].url' latest.json | sort -u); do
            curl -fsSIL -o /dev/null "$url"
            echo "ok $url"
          done
          latest="$(curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json" | jq -r .version)"
          test "$latest" = "${GITHUB_REF_NAME#v}"
