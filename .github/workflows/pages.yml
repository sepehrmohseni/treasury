name: Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/**
      - scripts/site-downloads.py
      - scripts/test_site_downloads.py
      - .github/workflows/pages.yml
  # For releases published by hand. The release workflow publishes with GITHUB_TOKEN, whose
  # events start no workflows, so its last job asks for this one through workflow_dispatch.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Building and deploying are separate jobs: deploying in the job that uploaded the artifact
  # sometimes does not see it yet (actions/deploy-pages#451), and only the deploy job needs
  # write access to Pages.
  build:
    name: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assemble the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site
          cp -R site/. _site/
          # The downloads name the files of every published release, the latest as one card per
          # platform; with no release yet the page keeps saying so.
          python3 -I scripts/test_site_downloads.py
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > releases.json
          python3 -I scripts/site-downloads.py releases.json _site/index.html
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
