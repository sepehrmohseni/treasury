name: CI

# Every job runs `cargo xtask ci <step>`, the same definition `scripts/docker-check.sh` runs
# locally, so a check passes or fails the same way in both places.

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these same checks on the tagged commit.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.100.0"
          components: rustfmt
      - run: cargo xtask ci fmt

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.100.0"
          components: clippy
          targets: wasm32-unknown-unknown
      # WebKitGTK and the libraries the Tauri shell links on Linux.
      - name: Install the desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo xtask ci clippy wasm

  supply-chain:
    name: cargo-deny and cargo-audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.100.0"
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: cargo-deny@0.22.1,cargo-audit@0.23.0
      - run: cargo xtask ci deny audit

  test:
    name: unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: cargo-nextest@0.9.152
      # WebKitGTK and the libraries the Tauri shell links on Linux.
      - name: Install the desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev
      - run: cargo xtask ci test

  integration:
    name: integration (containers)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: cargo-nextest@0.9.152
      # WebKitGTK and the libraries the Tauri shell links on Linux.
      - name: Install the desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev
      # The database images are large; pulling them up front keeps the tests' own time limits
      # about the tests. The tests pull anything missing themselves.
      - name: Pull test images
        run: |
          for image in postgres:19.0-alpine mysql:9.7.0 mariadb:12.3.2 mongo:8.0.17 \
            mcr.microsoft.com/mssql/server:2022-CU28-ubuntu-22.04; do
            docker pull -q "$image" &
          done
          wait
      - run: cargo xtask ci integration

  desktop:
    name: desktop app end to end
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.100.0"
          targets: wasm32-unknown-unknown
      - name: Install the desktop libraries, WebKitWebDriver and Xvfb
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev webkit2gtk-driver xvfb binaryen libgl1-mesa-dri libegl1 \
            libgbm1 fonts-dejavu-core
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: cargo-nextest@0.9.152
      # The same pinned versions as docker/ci/Dockerfile; --locked makes cargo check every
      # source against Cargo.lock's checksums. The cache above keeps the binaries between runs.
      - name: Install the interface and app tools
        run: |
          cargo install --locked trunk@0.22.2
          cargo install --locked wasm-bindgen-cli@0.2.130
          cargo install --locked tauri-cli@2.12.6
          cargo install --locked tauri-driver@2.1.0
      - run: docker pull -q postgres:19.0-alpine
      # A failure is also posted as an annotation, so its cause shows on the run's page.
      - name: cargo xtask ci desktop
        shell: bash
        run: |
          set -o pipefail
          if cargo xtask ci desktop 2>&1 | tee desktop.log; then exit 0; fi
          cause="$(sed 's/\x1b\[[0-9;]*m//g' desktop.log | grep -E -m1 -A25 'panicked|^error' | head -40)"
          cause="${cause//'%'/'%25'}"; cause="${cause//$'\r'/}"; cause="${cause//$'\n'/'%0A'}"
          echo "::error title=Desktop end-to-end test::${cause}"
          exit 1
